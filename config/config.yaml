# Olist MLOps Configuration

project:
  name: "olist-late-delivery"
  version: "1.0.0"
  description: "Production inference service for predicting late order deliveries"

model:
  name: "olist-late-delivery-model"
  version: "1"
  stage: "Production"
  alias: "champion"
  model_path: "models/best_model.joblib"
  preprocessor_path: "models/preprocessing_pipeline.joblib"
  feature_names_path: "models/feature_names.txt"
  metrics_path: "models/metrics.json"

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "olist-late-delivery"
  model_registry_name: "olist-late-delivery-model"
  model_stage: "Production"

data:
  sample_order_path: "data/sample_order.json"
  sample_batch_path: "data/sample_batch.json"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  log_file: "logs/app.log"
  prediction_log_file: "logs/predictions.jsonl"
  max_bytes: 10485760 # 10MB
  backup_count: 5

validation:
  min_price: 0.0
  min_freight: 0.0
  min_items: 1
  min_weight_g: 0.0
  min_volume_cm3: 0.0
  min_installments: 1
  allowed_payment_types:
    - "credit_card"
    - "boleto"
    - "voucher"
    - "debit_card"
    - "not_defined"
  allowed_brazilian_states:
    - "AC"
    - "AL"
    - "AM"
    - "AP"
    - "BA"
    - "CE"
    - "DF"
    - "ES"
    - "GO"
    - "MA"
    - "MG"
    - "MS"
    - "MT"
    - "PA"
    - "PB"
    - "PE"
    - "PI"
    - "PR"
    - "RJ"
    - "RN"
    - "RO"
    - "RR"
    - "RS"
    - "SC"
    - "SE"
    - "SP"
    - "TO"

monitoring:
  alert_thresholds:
    max_latency_ms: 500.0
    max_error_rate: 0.01
    baseline_late_rate: 0.0811
    max_drift_rate_deviation: 0.10
